# Cada etapa contiene comandos con sus argumentos. Se ejecutan desde la raíz.
[checks]
format = [["npm", "run", "format:check"]]
lint = [["npm", "run", "lint"]]
static = [["npm", "run", "typecheck"]]
test = [["npm", "test"]]
build = [["npm", "run", "build"]]
integration = [["npm", "run", "test:browser"]]
